# Floating terminal (kitty_mod+;, see float_term.sh), a kitten
# quick-access-terminal panel. The panel is a separate kitty instance that
# reads kitty.conf, with the overrides below.
#
# kitty gives its panels macOS's utility window fade on show/hide, with no
# option for it. It is turned off outside this repo, for the quick access app
# only (the qat.sh pickers too):
#   defaults write net.kovidgoyal.kitty-quick-access NSAutomaticWindowAnimationsEnabled -bool false
# undo with `defaults delete` on the same key; restart the panels either way.
edge center-sized
lines 30
columns 120
background_opacity 0.9
# Clicking elsewhere hides it, so it is on screen exactly while it has focus:
# float_term.sh tells whether to show or hide it from that
hide_on_focus_loss yes

# A plain shell: kitty.conf's startup_session would open the notes session
kitty_override startup_session=none
# Instant show/hide: kitty.conf's shaders without focus-dim, which animates
# focus changes (an empty value would be ignored), and no text faded while
# focus moves (inactive_text_alpha)
kitty_override custom_shaders=cursor-trail-blaze
kitty_override inactive_text_alpha=1.0
kitty_override tab_bar_style=hidden
kitty_override window_padding_width=8
# Border around its single window (kitty only draws borders between windows by
# default). Always the active color: with hide_on_focus_loss it is only on
# screen while focused
kitty_override draw_window_borders_for_single_window=yes
kitty_override window_border_width=2pt
kitty_override active_border_color=#d65c0d
