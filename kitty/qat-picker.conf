# Floating panel for the pickers (qat.sh), see kitten quick-access-terminal.
# The panel is a separate kitty instance that reads kitty.conf, with the
# overrides below.
edge center-sized
lines 20
columns 90
background_opacity 0.85

kitty_override tab_bar_style=hidden
# Room around the picker. Also keeps its top line from being cut when the
# panel moves from the external display to the Retina one
kitty_override window_padding_width=8
# Closes the picker when the panel loses focus
kitty_override watcher=watchers/qat_focus.py
